# Uploads every branch except main to Cloudflare Pages.
# staging -> https://staging.<repo>.pages.dev, other branches -> https://<branch>.<repo>.pages.dev
# Prod stays on GitHub Pages (main). Cloudflare adds `X-Robots-Tag: noindex` to these links.
# Needs the org secret CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit). The Pages project is named after
# the repo in lower case and is created on the first run if it doesn't exist yet.
name: staging-deploy
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
env:
  CF_ACCOUNT_ID: 2b2f3ad6dbb47fc399af7e97e266a117
concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='.git*' --exclude='.github' --exclude='.figma-sync' --exclude='.forge-edit*' \
            --exclude='.DS_Store' --exclude='tests' --exclude='docs' --exclude='tools' --exclude='scripts' \
            --exclude='README.md' \
            ./ "$RUNNER_TEMP/site/"
      - name: Serve files over 25 MiB from prod
        # Cloudflare Pages refuses files over 25 MiB. Staging redirects them to the
        # same path on the prod domain (from CNAME), so the page still plays them.
        run: |
          cd "$RUNNER_TEMP/site"
          PROD=""
          [ -f "$GITHUB_WORKSPACE/CNAME" ] && PROD=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/CNAME")
          find . -type f -size +25M -print0 | while IFS= read -r -d '' f; do
            p="${f#.}"
            rm "$f"
            if [ -n "$PROD" ]; then
              printf '%s https://%s%s 302\n' "$p" "$PROD" "$p" >> _redirects
              echo "::warning::$p is over 25 MiB, so staging serves it from https://$PROD$p"
            else
              echo "::warning::$p is over 25 MiB and was left out of staging"
            fi
          done
      - name: Project name
        id: project
        env:
          REPO: ${{ github.event.repository.name }}
        run: echo "name=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Create the Cloudflare Pages project if missing
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NAME: ${{ steps.project.outputs.name }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects"
          code=$(curl -sS -o /tmp/project.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "$api/$NAME")
          if [ "$code" = 200 ]; then
            echo "Project $NAME exists."
          elif [ "$code" = 404 ]; then
            jq -n --arg name "$NAME" '{name: $name, production_branch: "main"}' > /tmp/create.json
            curl -sS --fail-with-body -X POST -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" --data @/tmp/create.json "$api" > /dev/null
            echo "Created Cloudflare Pages project $NAME."
          else
            echo "::error::Cloudflare answered $code when looking up project $NAME"
            jq -c '.errors' /tmp/project.json || true
            exit 1
          fi
      - name: Upload to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          command: >-
            pages deploy ${{ runner.temp }}/site
            --project-name=${{ steps.project.outputs.name }}
            --branch=${{ github.ref_name }}
            --commit-hash=${{ github.sha }}
      - name: Link
        env:
          URL: ${{ steps.deploy.outputs.deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: |
          echo "Preview: $URL" >> "$GITHUB_STEP_SUMMARY"
